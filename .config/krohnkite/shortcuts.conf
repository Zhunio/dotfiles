# Disabled shortcut draft for KWin + Kröhnkite (Plasma 6).
# Every line is commented: this file changes nothing.
# KDE reads ~/.config/kglobalshortcutsrc, not this file directly.
# Apply only these entries there when ready; do not replace the whole KDE file.
# Format: action=active shortcut,default shortcut,description
# Kröhnkite action IDs below match release 0.9.9.2.
#
# [kwin]
#
# Directional focus: Alt + H/J/K/L.
# KrohnkiteFocusLeft=Alt+H,Meta+H,Krohnkite: Focus Left
# KrohnkiteFocusDown=Alt+J,Meta+J,Krohnkite: Focus Down
# KrohnkiteFocusUp=Alt+K,Meta+K,Krohnkite: Focus Up
# KrohnkiteFocusRight=Alt+L,Meta+L,Krohnkite: Focus Right
#
# Directional movement: Shift + Alt + H/J/K/L.
# Layout-dependent movement, not necessarily yabai's directional swap.
# KrohnkiteShiftLeft=Alt+Shift+H,Meta+Shift+H,Krohnkite: Move Left
# KrohnkiteShiftDown=Alt+Shift+J,Meta+Shift+J,Krohnkite: Move Down/Next
# KrohnkiteShiftUp=Alt+Shift+K,Meta+Shift+K,Krohnkite: Move Up/Prev
# KrohnkiteShiftRight=Alt+Shift+L,Meta+Shift+L,Krohnkite: Move Right
#
# Layout resizing: Shift + Alt + arrows (not fixed 200-pixel steps).
# The lowercase g in KrohnkitegrowWidth is the upstream action ID.
# KrohnkiteShrinkWidth=Alt+Shift+Left,Meta+Ctrl+H,Krohnkite: Shrink Width
# KrohnkiteGrowHeight=Alt+Shift+Down,Meta+Ctrl+J,Krohnkite: Grow Height
# KrohnkiteShrinkHeight=Alt+Shift+Up,Meta+Ctrl+K,Krohnkite: Shrink Height
# KrohnkitegrowWidth=Alt+Shift+Right,Meta+Ctrl+L,Krohnkite: Grow Width
#
# Switch desktops: Ctrl + 1...9. Create the target desktops in KDE first.
# Switch to Desktop 1=Ctrl+1,Ctrl+F1,Switch to Desktop 1
# Switch to Desktop 2=Ctrl+2,Ctrl+F2,Switch to Desktop 2
# Switch to Desktop 3=Ctrl+3,Ctrl+F3,Switch to Desktop 3
# Switch to Desktop 4=Ctrl+4,Ctrl+F4,Switch to Desktop 4
# Switch to Desktop 5=Ctrl+5,none,Switch to Desktop 5
# Switch to Desktop 6=Ctrl+6,none,Switch to Desktop 6
# Switch to Desktop 7=Ctrl+7,none,Switch to Desktop 7
# Switch to Desktop 8=Ctrl+8,none,Switch to Desktop 8
# Switch to Desktop 9=Ctrl+9,none,Switch to Desktop 9
#
# Move windows to desktops: Shift + Ctrl + 1...9.
# These native KWin actions move only; following the window needs a helper.
# Window to Desktop 1=Ctrl+Shift+1,none,Window to Desktop 1
# Window to Desktop 2=Ctrl+Shift+2,none,Window to Desktop 2
# Window to Desktop 3=Ctrl+Shift+3,none,Window to Desktop 3
# Window to Desktop 4=Ctrl+Shift+4,none,Window to Desktop 4
# Window to Desktop 5=Ctrl+Shift+5,none,Window to Desktop 5
# Window to Desktop 6=Ctrl+Shift+6,none,Window to Desktop 6
# Window to Desktop 7=Ctrl+Shift+7,none,Window to Desktop 7
# Window to Desktop 8=Ctrl+Shift+8,none,Window to Desktop 8
# Window to Desktop 9=Ctrl+Shift+9,none,Window to Desktop 9
#
# Maximize/restore the active window: Alt + M (not yabai's tiled zoom).
# Window Maximize=Alt+M,Meta+PgUp,Maximize Window
#
# Not mapped: Alt+N (create desktop), Shift+Alt+N (create/move/follow),
# Alt+D (remove desktop), Alt+O / Shift+Alt+O (global opacity),
# Shift+Alt+R (reload). These need separate, tested implementations.
# Deferred: rotation, mirroring, split toggling, balancing.
# Check for conflicting KDE bindings before enabling any shortcuts.
