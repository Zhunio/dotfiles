### Load plugins
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'

### Configure @catpuccin plugin BEFORE running it

# Set @catppuccin flavor
set -g @catppuccin_flavor "mocha"
# Set @catppuccin window status style rounded
set -g @catppuccin_window_status_style "rounded"
# Set @catppuccin status line transparent
set -g @catppuccin_status_background "#011627"

# Set @catppuccin left & right separators
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator ""
# Set @catppuccin status section separators to "no"
set -g @catppuccin_status_connect_separator "no"

### Set @catppuccin window options
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_number_position "right"

### Set @catppuccin plugins options

# set @catppuccin_status_user options
set -g @catppuccin_user_color "#{@thm_peach}"
set -g @catppuccin_battery_color "#{@thm_green}"

### ** Run catpuccin plugin **
### ** BE CAREFUL YOU PLACE THIS LINE **
run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'

### ** Load CUSTOM MODULES **
source -F '#{d:current_file}/modules/custom_cpu.conf'
source -F '#{d:current_file}/modules/custom_memory.conf'
source -F '#{d:current_file}/modules/custom_time.conf'

### Set @catppuccin status line lengths
set -g status-right-length 100
set -g status-left-length 100

### Set @catppuccin left status line
set -g status-left "#{E:@catppuccin_status_session} "

# Screen breakpoints (columns); below sm, hide all right-side indicators.
set -g @screen_sm 50
set -g @screen_md 100
set -g @screen_lg 150

# Visibility rules: sm adds time, md adds CPU/RAM/battery, lg adds username.
set -g @show_time '#{e|>=:#{client_width},#{@screen_sm}}'
set -g @show_stats '#{e|>=:#{client_width},#{@screen_md}}'
set -g @show_extra '#{e|>=:#{client_width},#{@screen_lg}}'

# set-option flags:
#   -g  Set the option globally.
#   -q  Suppress certain option errors.
#   -F  Expand formats before storing the value.
#
# Format syntax:
#   #{?condition,when_true,when_false}  Choose what to display.
#   #{E:@option}                      Evaluate the formats stored in an option.
#   ##                                Preserve a literal # through -F expansion.
# Example: ##{?##{E:@show_time},TIME,} is stored as #{?#{E:@show_time},TIME,}.
set -gqF @status_user "##{?##{E:@show_extra},#{s/,bg=/]#[bg=/;E:@catppuccin_status_user} ,}"
set -gqF @status_cpu "##{?##{E:@show_stats},#{s/,bg=/]#[bg=/;E:@catppuccin_status_custom_cpu} ,}"
set -gqF @status_ram "##{?##{E:@show_stats},#{s/,bg=/]#[bg=/;E:@catppuccin_status_custom_memory} ,}"
set -gqF @status_battery "##{?##{E:@show_stats},#{s/,bg=/]#[bg=/;E:@catppuccin_status_battery} ,}"
set -gqF @status_time "##{?##{E:@show_time},#{s/,bg=/]#[bg=/;E:@catppuccin_status_custom_time},}"

# Layout order, left to right. Do not use E: here: the plugins need the raw formats.
set -gqF status-right "#{@status_user}\
#{@status_cpu}\
#{@status_ram}\
#{@status_battery}\
#{@status_time}"
